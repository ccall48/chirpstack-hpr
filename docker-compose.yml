services:
  chirpstack-hpr-v2:
    image: ccall48/chirpstack-hpr-v2:latest
    container_name: chirpstack-hpr-v2
    restart: unless-stopped
    volumes:
      - ./app:/app
      - ${HELIUM_KEYPAIR_PATH}:/app/delegate_key.bin:ro
    environment:
      # Helium (Required)
      - HELIUM_CONFIG_HOST=${HELIUM_CONFIG_HOST}
      - HELIUM_KEYPAIR_BIN=${HELIUM_KEYPAIR_BIN}
      - HELIUM_NET_ID=${HELIUM_NET_ID}
      - HELIUM_OUI=${HELIUM_OUI}
      - HELIUM_MAX_COPIES=${HELIUM_MAX_COPIES}
      - ROUTE_ID=${ROUTE_ID}
      # ChirpStack (Required)
      - CHIRPSTACK_SERVER=${CHIRPSTACK_SERVER}
      - CHIRPSTACK_APIKEY=${CHIRPSTACK_APIKEY}
      - REDIS_HOST=${REDIS_HOST}
      # Optional direct usage publishing
      - PUBLISH_USAGE_EVENTS=${PUBLISH_USAGE_EVENTS:-False}
      - PUBLISH_USAGE_EVENTS_PROVIDER=${PUBLISH_USAGE_EVENTS_PROVIDER:-AWS_SQS}
      - PUBLISH_USAGE_EVENTS_SQS_URL=${PUBLISH_USAGE_EVENTS_SQS_URL:-}
      - PUBLISH_USAGE_EVENTS_SQS_REGION=${PUBLISH_USAGE_EVENTS_SQS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    command: sh -c 'cd /app && python app.py'

  redis-hpr-v2:
    image: redis:8-alpine
    container_name: redis-hpr-v2
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - ./data:/data

networks:
  default:
    name: core-infra
    external: true
